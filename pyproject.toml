[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "basim-attractor"
version = "0.2.0"
description = "Interactive explainer for layered attractor dynamics in speech perception"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "PySide6>=6.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
basim = "basim.app:main"

[tool.setuptools.packages.find]
include = ["basim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
