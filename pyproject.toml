[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "basim"
version = "0.1.0"
description = "Layered adaptive attractor explainer for speech integration dynamics"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "PySide6>=6.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
basim = "basim.ui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
